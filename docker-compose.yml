version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: spendwise-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: spendwise
      POSTGRES_USER: spendwise_user
      POSTGRES_PASSWORD: spendwise_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendwise_user -d spendwise"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spendwise-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=SpendWise
      - DEBUG=False
      - SECRET_KEY=spendwise-production-super-secret-jwt-key-change-in-prod
      - DATABASE_URL=postgresql+psycopg://spendwise_user:spendwise_password@db:5432/spendwise
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - CORS_ORIGINS=["http://localhost","http://localhost:80","http://localhost:5173","http://127.0.0.1:5173"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spendwise-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
